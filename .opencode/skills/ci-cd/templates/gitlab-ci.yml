# ============================================================================
# GitLab CI — Full Pipeline
# Stacks: Python 3.12 (FastAPI) + Angular 18+ (pnpm) + Bun (TypeScript)
# Stages: lint → test → security → build → deploy
# ============================================================================
# Usage:
#   1. Copy this file to .gitlab-ci.yml in repository root
#   2. Configure CI/CD variables in GitLab → Settings → CI/CD → Variables:
#      - CI_REGISTRY_USER     (registry user, auto-set for GitLab Container Registry)
#      - CI_REGISTRY_PASSWORD (registry password, auto-set)
#      - KUBE_CONFIG          (base64 kubeconfig for deploy)
#      - SLACK_WEBHOOK        (optional notifications)
#   3. Requires GitLab Runner with docker executor
# ============================================================================

default:
  image: alpine:3.20
  tags:
    - docker
  interruptible: true

stages:
  - lint
  - test
  - security
  - build
  - deploy

variables:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "20"
  BUN_VERSION: "1"
  # GitLab Container Registry (auto-available in GitLab)
  REGISTRY: ${CI_REGISTRY}
  IMAGE_TAG: ${CI_COMMIT_SHORT_SHA}

# ═══════════════════════════════════════════════════════════════
# CACHE — shared across stages
# ═══════════════════════════════════════════════════════════════
.python-cache: &python-cache
  cache:
    key:
      files:
        - backend/requirements.txt
        - backend/requirements-dev.txt
    paths:
      - backend/.pip-cache/
    policy: pull-push

.node-cache: &node-cache
  cache:
    key:
      files:
        - frontend/pnpm-lock.yaml
    paths:
      - frontend/node_modules/
      - frontend/.pnpm-store/
    policy: pull-push

# ─── RULES: path-based execution ──────────────────────────────
.rules-backend: &rules-backend
  rules:
    - changes:
        - backend/**/*
        - pyproject.toml
        - requirements*.txt
        - alembic.ini
        - migrations/**/*
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"

.rules-frontend: &rules-frontend
  rules:
    - changes:
        - frontend/**/*
        - package.json
        - pnpm-lock.yaml
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"

.rules-bun: &rules-bun
  rules:
    - changes:
        - services/**/*
        - package.json
        - bun.lock*
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"

.rules-main-branch: &rules-main-branch
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

.rules-tag: &rules-tag
  rules:
    - if: $CI_COMMIT_TAG

# ═══════════════════════════════════════════════════════════════
# STAGE 1 — LINT
# ═══════════════════════════════════════════════════════════════

# ── Python Lint ───────────────────────────────────────────────
python-lint:
  stage: lint
  image: python:${PYTHON_VERSION}-slim
  <<: *rules-backend
  before_script:
    - cd backend
    - pip install --cache-dir .pip-cache ruff
  script:
    - ruff check .
    - ruff format --check .
  cache:
    key: python-lint
    paths:
      - backend/.pip-cache/

# ── Angular Lint ──────────────────────────────────────────────
angular-lint:
  stage: lint
  image: node:${NODE_VERSION}
  <<: *rules-frontend
  before_script:
    - corepack enable
    - cd frontend
    - pnpm install --frozen-lockfile
  script:
    - pnpm ng lint
    - pnpm tsc --noEmit
  cache:
    key:
      files:
        - frontend/pnpm-lock.yaml
    paths:
      - frontend/node_modules/

# ── Bun Lint ──────────────────────────────────────────────────
bun-lint:
  stage: lint
  image: oven/bun:${BUN_VERSION}
  <<: *rules-bun
  before_script:
    - cd services
    - bun install --frozen-lockfile
  script:
    - bunx eslint src/ --max-warnings=0
    - bunx tsc --noEmit

# ═══════════════════════════════════════════════════════════════
# STAGE 2 — TEST
# ═══════════════════════════════════════════════════════════════

# ── Python Test ───────────────────────────────────────────────
python-test:
  stage: test
  image: python:${PYTHON_VERSION}-slim
  <<: *rules-backend
  services:
    - name: pgvector/pgvector:pg16
      alias: postgres
    - name: redis:7-alpine
      alias: redis
  variables:
    POSTGRES_USER: testuser
    POSTGRES_PASSWORD: testpass
    POSTGRES_DB: testdb
    DATABASE_URL: postgresql+asyncpg://testuser:testpass@postgres:5432/testdb
    REDIS_URL: redis://redis:6379/0
    APP_ENV: test
  before_script:
    - cd backend
    - pip install --cache-dir .pip-cache -r requirements.txt -r requirements-dev.txt
  script:
    - alembic upgrade head
    - pytest --cov=src --cov-report=xml --cov-report=html -n auto -v
  artifacts:
    when: always
    reports:
      coverage_report:
        coverage_format: cobertura
        path: backend/coverage.xml
    paths:
      - backend/htmlcov/
    expire_in: 7 days
  coverage: '/TOTAL.*\s+(\d+\.?\d*%)$/'

# ── Angular Test ──────────────────────────────────────────────
angular-test:
  stage: test
  image: node:${NODE_VERSION}
  <<: *rules-frontend
  before_script:
    - corepack enable
    - cd frontend
    - pnpm install --frozen-lockfile
    - apt-get update && apt-get install -y chromium
    - export CHROME_BIN=chromium
  script:
    - pnpm ng test --code-coverage --watch=false --browsers=ChromeHeadless
  artifacts:
    when: always
    paths:
      - frontend/coverage/
    expire_in: 7 days

# ── Bun Test ──────────────────────────────────────────────────
bun-test:
  stage: test
  image: oven/bun:${BUN_VERSION}
  <<: *rules-bun
  services:
    - name: postgres:16
      alias: postgres
  variables:
    POSTGRES_USER: testuser
    POSTGRES_PASSWORD: testpass
    POSTGRES_DB: testdb
    DATABASE_URL: postgres://testuser:testpass@postgres:5432/testdb
    NODE_ENV: test
  before_script:
    - cd services
    - bun install --frozen-lockfile
  script:
    - bunx vitest run --coverage
  artifacts:
    when: always
    paths:
      - services/coverage/
    expire_in: 7 days

# ═══════════════════════════════════════════════════════════════
# STAGE 3 — SECURITY
# ═══════════════════════════════════════════════════════════════

# ── Semgrep SAST ──────────────────────────────────────────────
sast-semgrep:
  stage: security
  image: semgrep/semgrep
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
  script:
    - semgrep ci --config p/default || true
  allow_failure: true

# ── Trivy Container Scan ──────────────────────────────────────
trivy-scan:
  stage: security
  image:
    name: aquasec/trivy:latest
    entrypoint: [""]
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
  script:
    - trivy fs --exit-code 0 --severity HIGH,CRITICAL --no-progress .
    - echo "Trivy scan completed"
  allow_failure: true

# ── GitLeaks Secret Detection ─────────────────────────────────
secret-detection:
  stage: security
  image:
    name: zricethezav/gitleaks:latest
    entrypoint: [""]
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
  script:
    - gitleaks detect --source . --verbose
  allow_failure: true

# ═══════════════════════════════════════════════════════════════
# STAGE 4 — BUILD & PUSH
# ═══════════════════════════════════════════════════════════════

# ── Build Python ──────────────────────────────────────────────
build-python:
  stage: build
  image: docker:24
  services:
    - docker:24-dind
  <<: *rules-main-branch
  before_script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
  script:
    - docker build
      --cache-from $REGISTRY/$CI_PROJECT_PATH/api:latest
      -t $REGISTRY/$CI_PROJECT_PATH/api:$IMAGE_TAG
      -t $REGISTRY/$CI_PROJECT_PATH/api:latest
      -f backend/Dockerfile backend/
    - docker push $REGISTRY/$CI_PROJECT_PATH/api:$IMAGE_TAG
    - docker push $REGISTRY/$CI_PROJECT_PATH/api:latest

# ── Build Angular ─────────────────────────────────────────────
build-angular:
  stage: build
  image: docker:24
  services:
    - docker:24-dind
  <<: *rules-main-branch
  before_script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
  script:
    - docker build
      --cache-from $REGISTRY/$CI_PROJECT_PATH/web:latest
      -t $REGISTRY/$CI_PROJECT_PATH/web:$IMAGE_TAG
      -t $REGISTRY/$CI_PROJECT_PATH/web:latest
      -f frontend/Dockerfile frontend/
    - docker push $REGISTRY/$CI_PROJECT_PATH/web:$IMAGE_TAG
    - docker push $REGISTRY/$CI_PROJECT_PATH/web:latest

# ── Build Bun ─────────────────────────────────────────────────
build-bun:
  stage: build
  image: docker:24
  services:
    - docker:24-dind
  <<: *rules-main-branch
  before_script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
  script:
    - docker build
      --cache-from $REGISTRY/$CI_PROJECT_PATH/bun-api:latest
      -t $REGISTRY/$CI_PROJECT_PATH/bun-api:$IMAGE_TAG
      -t $REGISTRY/$CI_PROJECT_PATH/bun-api:latest
      -f services/Dockerfile services/
    - docker push $REGISTRY/$CI_PROJECT_PATH/bun-api:$IMAGE_TAG
    - docker push $REGISTRY/$CI_PROJECT_PATH/bun-api:latest

# ═══════════════════════════════════════════════════════════════
# STAGE 5 — DEPLOY
# ═══════════════════════════════════════════════════════════════

# ── Deploy Staging ────────────────────────────────────────────
deploy-staging:
  stage: deploy
  image: bitnami/kubectl:latest
  environment:
    name: staging
    url: https://staging.example.com
  rules:
    - if: $CI_COMMIT_BRANCH == "develop"
  before_script:
    - echo "$KUBE_CONFIG" | base64 -d > /tmp/kubeconfig
  script:
    - kubectl --kubeconfig /tmp/kubeconfig set image deployment/api
      api=$REGISTRY/$CI_PROJECT_PATH/api:$IMAGE_TAG -n staging
    - kubectl --kubeconfig /tmp/kubeconfig set image deployment/web
      web=$REGISTRY/$CI_PROJECT_PATH/web:$IMAGE_TAG -n staging
    - kubectl --kubeconfig /tmp/kubeconfig set image deployment/bun-api
      bun-api=$REGISTRY/$CI_PROJECT_PATH/bun-api:$IMAGE_TAG -n staging
    - kubectl --kubeconfig /tmp/kubeconfig rollout status deployment/api -n staging --timeout=5m
    - kubectl --kubeconfig /tmp/kubeconfig rollout status deployment/web -n staging --timeout=5m
    - kubectl --kubeconfig /tmp/kubeconfig rollout status deployment/bun-api -n staging --timeout=5m
  after_script:
    - rm -f /tmp/kubeconfig

# ── Deploy Production (manual gate) ───────────────────────────
deploy-production:
  stage: deploy
  image: bitnami/kubectl:latest
  environment:
    name: production
    url: https://example.com
  rules:
    - if: $CI_COMMIT_TAG
      when: manual
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: manual
  before_script:
    - echo "$KUBE_CONFIG_PROD" | base64 -d > /tmp/kubeconfig
    # Run DB migrations on production
    # - kubectl --kubeconfig /tmp/kubeconfig exec -it deployment/api -n prod -- alembic upgrade head
  script:
    - kubectl --kubeconfig /tmp/kubeconfig set image deployment/api
      api=$REGISTRY/$CI_PROJECT_PATH/api:$IMAGE_TAG -n prod
    - kubectl --kubeconfig /tmp/kubeconfig set image deployment/web
      web=$REGISTRY/$CI_PROJECT_PATH/web:$IMAGE_TAG -n prod
    - kubectl --kubeconfig /tmp/kubeconfig set image deployment/bun-api
      bun-api=$REGISTRY/$CI_PROJECT_PATH/bun-api:$IMAGE_TAG -n prod
    - kubectl --kubeconfig /tmp/kubeconfig rollout status deployment/api -n prod --timeout=5m
    - kubectl --kubeconfig /tmp/kubeconfig rollout status deployment/web -n prod --timeout=5m
    - kubectl --kubeconfig /tmp/kubeconfig rollout status deployment/bun-api -n prod --timeout=5m
  after_script:
    - rm -f /tmp/kubeconfig

# ── Rollback Job (manual, no stage — only when invoked) ───────
rollback:
  stage: deploy
  image: bitnami/kubectl:latest
  when: manual
  rules:
    - if: $ROLLBACK_TAG
      when: manual
  before_script:
    - echo "$KUBE_CONFIG_PROD" | base64 -d > /tmp/kubeconfig
    - echo "Rolling back to tag: $ROLLBACK_TAG"
  script:
    - kubectl --kubeconfig /tmp/kubeconfig set image deployment/api
      api=$REGISTRY/$CI_PROJECT_PATH/api:$ROLLBACK_TAG -n prod
    - kubectl --kubeconfig /tmp/kubeconfig rollout status deployment/api -n prod --timeout=5m
  after_script:
    - rm -f /tmp/kubeconfig

# ── Notify Slack ──────────────────────────────────────────────
notify-slack:
  stage: deploy
  image: curlimages/curl:latest
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG
  when: always
  script:
    - |
      STATUS="$CI_JOB_STATUS"
      if [ "$STATUS" = "success" ]; then
        EMOJI=":rocket:"
        TEXT="Deploy succeeded — $CI_PROJECT_NAME@$CI_COMMIT_SHORT_SHA to $CI_ENVIRONMENT_NAME"
      else
        EMOJI=":x:"
        TEXT="Deploy FAILED — $CI_PROJECT_NAME@$CI_COMMIT_SHORT_SHA"
      fi
      curl -X POST -H 'Content-type: application/json' \
        --data "{\"text\":\"$EMOJI $TEXT\"}" \
        $SLACK_WEBHOOK
  needs:
    - deploy-staging
    - deploy-production
