# =============================================================================
# NGINX API Gateway — Reverse Proxy Configuration
# =============================================================================
# Stack: NGINX as reverse proxy → FastAPI (Python) + Bun (TypeScript) services
# Features: SSL termination, rate limiting, CORS, WebSocket support,
#           JWT auth_request, correlation IDs, path-based routing
# =============================================================================

# ---------------------------------------------------------------------------
# Worker & connection tuning
# ---------------------------------------------------------------------------
worker_processes auto;
worker_rlimit_nofile 65535;

events {
    worker_connections 4096;
    use epoll;
    multi_accept on;
}

http {
    # -----------------------------------------------------------------------
    # Base settings
    # -----------------------------------------------------------------------
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    keepalive_requests 1000;
    types_hash_max_size 2048;
    server_tokens off;
    client_max_body_size 50M;
    client_body_timeout 30s;
    client_header_timeout 10s;

    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # -----------------------------------------------------------------------
    # Logging — structured JSON for observability (Grafana / Loki / ELK)
    # -----------------------------------------------------------------------
    log_format gateway_json escape=json '{'
        '"timestamp":"$time_iso8601",'
        '"level":"info",'
        '"remote_addr":"$remote_addr",'
        '"real_ip":"$http_x_forwarded_for",'
        '"method":"$request_method",'
        '"uri":"$request_uri",'
        '"status":$status,'
        '"body_bytes_sent":$body_bytes_sent,'
        '"request_time":$request_time,'
        '"upstream_addr":"$upstream_addr",'
        '"upstream_response_time":"$upstream_response_time",'
        '"upstream_status":"$upstream_status",'
        '"host":"$host",'
        '"user_agent":"$http_user_agent",'
        '"correlation_id":"$correlation_id",'
        '"tenant_id":"$http_x_tenant_id",'
        '"user_id":"$http_x_user_id"'
        '}';

    access_log /var/log/nginx/access.log gateway_json buffer=32k flush=5s;
    error_log  /var/log/nginx/error.log  warn;

    # -----------------------------------------------------------------------
    # Rate limiting zones
    # -----------------------------------------------------------------------
    # Per-IP rate limit (burst = 20, nodelay for immediate rejection above burst)
    limit_req_zone $binary_remote_addr zone=ip_limit:10m rate=30r/s;
    # Per-route rate limit for sensitive endpoints (login, token refresh)
    limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=5r/s;
    # Per-tenant rate limit (uses X-Tenant-Id header)
    limit_req_zone $http_x_tenant_id zone=tenant_limit:10m rate=100r/s;
    # Per-API-key rate limit
    limit_req_zone $http_x_api_key zone=apikey_limit:10m rate=50r/s;

    # Connection limiting per IP (DDoS mitigation)
    limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

    # -----------------------------------------------------------------------
    # Map blocks — dynamic variables
    # -----------------------------------------------------------------------
    # Extract correlation ID from request or generate new
    map $http_x_correlation_id $correlation_id {
        ""      $request_id;       # NGINX generates $request_id if header absent
        default $http_x_correlation_id;
    }

    # Map to determine if request is WebSocket upgrade
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # -----------------------------------------------------------------------
    # Upstream definitions
    # -----------------------------------------------------------------------
    # Python FastAPI services
    upstream user_service {
        # Use Docker DNS or service mesh; least_conn for better load distribution
        least_conn;
        server user-service:8000 max_fails=3 fail_timeout=30s;
        server user-service:8001 max_fails=3 fail_timeout=30s;
        keepalive 64;
    }

    upstream order_service {
        least_conn;
        server order-service:8000 max_fails=3 fail_timeout=30s;
        keepalive 64;
    }

    upstream notification_service {
        least_conn;
        server notification-service:8000 max_fails=3 fail_timeout=30s;
        keepalive 32;
    }

    # Bun TypeScript backend
    upstream bun_backend_service {
        least_conn;
        server bun-service:3000 max_fails=3 fail_timeout=30s;
        server bun-service:3001 max_fails=3 fail_timeout=30s;
        keepalive 64;
    }

    # Internal auth service for token validation
    upstream auth_service {
        server auth-service:8082 max_fails=3 fail_timeout=10s;
        keepalive 32;
    }

    # WebSocket upstream (sticky sessions for stateful WS connections)
    upstream ws_service {
        ip_hash;
        server ws-service:8002 max_fails=3 fail_timeout=15s;
        keepalive 16;
    }

    # -----------------------------------------------------------------------
    # Main server block (HTTPS)
    # -----------------------------------------------------------------------
    server {
        listen 443 ssl http2;
        server_name api.example.com;

        # ---- SSL / TLS ----
        ssl_certificate     /etc/nginx/ssl/cert.pem;
        ssl_certificate_key /etc/nginx/ssl/key.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;
        ssl_session_cache   shared:SSL:10m;
        ssl_session_timeout 10m;

        # ---- Connection limits (DDoS) ----
        limit_conn conn_limit 50;
        limit_conn_status 429;

        # ---- Real IP from CDN / load balancer ----
        set_real_ip_from 10.0.0.0/8;
        set_real_ip_from 172.16.0.0/12;
        set_real_ip_from 192.168.0.0/16;
        real_ip_header    X-Forwarded-For;
        real_ip_recursive on;

        # ===================================================================
        # CORS — centralized for all routes
        # ===================================================================
        # Variables to determine CORS eligibility from allowed origins map
        set $cors_origin "";
        set $cors_methods "GET, POST, PUT, PATCH, DELETE, OPTIONS";
        set $cors_headers "Authorization, Content-Type, X-Correlation-Id, X-Tenant-Id, X-Api-Key, Accept-Language";
        set $cors_max_age 86400;

        # Map of allowed origins (add production domains here)
        map $http_origin $allowed_origin {
            default                          "";
            "https://app.example.com"        "$http_origin";
            "https://admin.example.com"      "$http_origin";
            "http://localhost:5173"           "$http_origin";   # React (Vite) dev server
            "http://localhost:3000"           "$http_origin";   # Bun dev server
        }

        # ---- Correlation ID header added to every response ----
        add_header X-Correlation-Id $correlation_id always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;

        # ===================================================================
        # Excluded paths — no auth, no rate limit
        # ===================================================================
        location /health {
            auth_request off;
            access_log off;
            return 200 '{"status":"healthy","gateway":"nginx"}';
            add_header Content-Type application/json;
        }

        location /metrics {
            auth_request off;
            # Stub metrics endpoint; integrate with Prometheus nginx exporter in prod
            return 200 'nginx_gateway_up 1';
            add_header Content-Type text/plain;
        }

        location /swagger {
            auth_request off;
            proxy_pass http://user_service/swagger;
            proxy_set_header Host $host;
            proxy_set_header X-Correlation-Id $correlation_id;
        }

        location /openapi.json {
            auth_request off;
            proxy_pass http://user_service/openapi.json;
            proxy_set_header Host $host;
            proxy_set_header X-Correlation-Id $correlation_id;
        }

        # ===================================================================
        # Internal auth validation endpoint
        # ===================================================================
        location /auth/validate {
            internal;   # Only accessible via auth_request, never externally
            proxy_pass http://auth_service/validate;
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
            proxy_set_header X-Original-URI $request_uri;
            proxy_set_header X-Original-Method $request_method;
            proxy_set_header X-Correlation-Id $correlation_id;
            proxy_set_header Host $host;
            proxy_connect_timeout 3s;     # Auth must be fast
            proxy_read_timeout 5s;
            proxy_next_upstream error timeout http_502 http_503;
        }

        # ===================================================================
        # Auth-protected routes — FastAPI (Python) services
        # ===================================================================

        # ---- User Service (FastAPI) ----
        location /users/api/v1/ {
            # Validate JWT before routing to upstream
            auth_request /auth/validate;
            auth_request_set $user_id    $upstream_http_x_user_id;
            auth_request_set $roles      $upstream_http_x_roles;
            auth_request_set $tenant_id  $upstream_http_x_tenant_id;

            # Rate limiting: per-IP + per-tenant
            limit_req zone=ip_limit burst=30 nodelay;
            limit_req zone=tenant_limit burst=50 nodelay;

            # Propagate identity headers to downstream service
            proxy_set_header X-User-Id        $user_id;
            proxy_set_header X-Roles          $roles;
            proxy_set_header X-Tenant-Id      $tenant_id;
            proxy_set_header X-Correlation-Id $correlation_id;
            proxy_set_header X-Real-IP        $remote_addr;
            proxy_set_header X-Forwarded-For  $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Host             $host;

            # Path rewrite: strip /users prefix before forwarding
            # /users/api/v1/profile → /api/v1/profile
            rewrite ^/users(/api/v1/.*)$ $1 break;
            proxy_pass http://user_service;

            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_connect_timeout 5s;
            proxy_read_timeout 30s;
            proxy_send_timeout 30s;
            proxy_buffering off;

            # CORS preflight
            if ($request_method = 'OPTIONS') {
                add_header Access-Control-Allow-Origin $allowed_origin;
                add_header Access-Control-Allow-Methods $cors_methods;
                add_header Access-Control-Allow-Headers $cors_headers;
                add_header Access-Control-Max-Age $cors_max_age;
                add_header Content-Type text/plain;
                add_header Content-Length 0;
                return 204;
            }
            add_header Access-Control-Allow-Origin $allowed_origin always;
            add_header Access-Control-Allow-Credentials true always;
        }

        # ---- Order Service (FastAPI) ----
        location /orders/api/v1/ {
            auth_request /auth/validate;
            auth_request_set $user_id    $upstream_http_x_user_id;
            auth_request_set $roles      $upstream_http_x_roles;
            auth_request_set $tenant_id  $upstream_http_x_tenant_id;

            limit_req zone=ip_limit burst=30 nodelay;
            limit_req zone=tenant_limit burst=50 nodelay;

            proxy_set_header X-User-Id        $user_id;
            proxy_set_header X-Roles          $roles;
            proxy_set_header X-Tenant-Id      $tenant_id;
            proxy_set_header X-Correlation-Id $correlation_id;
            proxy_set_header X-Real-IP        $remote_addr;
            proxy_set_header X-Forwarded-For  $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Host             $host;

            rewrite ^/orders(/api/v1/.*)$ $1 break;
            proxy_pass http://order_service;

            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_connect_timeout 5s;
            proxy_read_timeout 30s;
            proxy_send_timeout 30s;
            proxy_buffering off;

            if ($request_method = 'OPTIONS') {
                add_header Access-Control-Allow-Origin $allowed_origin;
                add_header Access-Control-Allow-Methods $cors_methods;
                add_header Access-Control-Allow-Headers $cors_headers;
                add_header Access-Control-Max-Age $cors_max_age;
                add_header Content-Type text/plain;
                add_header Content-Length 0;
                return 204;
            }
            add_header Access-Control-Allow-Origin $allowed_origin always;
            add_header Access-Control-Allow-Credentials true always;
        }

        # ---- Notification Service (FastAPI) ----
        location /notifications/api/v1/ {
            auth_request /auth/validate;
            auth_request_set $user_id    $upstream_http_x_user_id;
            auth_request_set $roles      $upstream_http_x_roles;
            auth_request_set $tenant_id  $upstream_http_x_tenant_id;

            limit_req zone=ip_limit burst=20 nodelay;

            proxy_set_header X-User-Id        $user_id;
            proxy_set_header X-Roles          $roles;
            proxy_set_header X-Tenant-Id      $tenant_id;
            proxy_set_header X-Correlation-Id $correlation_id;
            proxy_set_header X-Real-IP        $remote_addr;
            proxy_set_header X-Forwarded-For  $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Host             $host;

            rewrite ^/notifications(/api/v1/.*)$ $1 break;
            proxy_pass http://notification_service;

            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_connect_timeout 5s;
            proxy_read_timeout 15s;

            if ($request_method = 'OPTIONS') {
                add_header Access-Control-Allow-Origin $allowed_origin;
                add_header Access-Control-Allow-Methods $cors_methods;
                add_header Access-Control-Allow-Headers $cors_headers;
                add_header Access-Control-Max-Age $cors_max_age;
                add_header Content-Type text/plain;
                add_header Content-Length 0;
                return 204;
            }
            add_header Access-Control-Allow-Origin $allowed_origin always;
            add_header Access-Control-Allow-Credentials true always;
        }

        # ===================================================================
        # Bun (TypeScript) Backend routes
        # ===================================================================
        location /bun/api/v1/ {
            auth_request /auth/validate;
            auth_request_set $user_id    $upstream_http_x_user_id;
            auth_request_set $roles      $upstream_http_x_roles;
            auth_request_set $tenant_id  $upstream_http_x_tenant_id;

            limit_req zone=ip_limit burst=30 nodelay;

            proxy_set_header X-User-Id        $user_id;
            proxy_set_header X-Roles          $roles;
            proxy_set_header X-Tenant-Id      $tenant_id;
            proxy_set_header X-Correlation-Id $correlation_id;
            proxy_set_header X-Real-IP        $remote_addr;
            proxy_set_header X-Forwarded-For  $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Host             $host;

            rewrite ^/bun(/api/v1/.*)$ $1 break;
            proxy_pass http://bun_backend_service;

            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_connect_timeout 5s;
            proxy_read_timeout 30s;
            proxy_send_timeout 30s;

            if ($request_method = 'OPTIONS') {
                add_header Access-Control-Allow-Origin $allowed_origin;
                add_header Access-Control-Allow-Methods $cors_methods;
                add_header Access-Control-Allow-Headers $cors_headers;
                add_header Access-Control-Max-Age $cors_max_age;
                add_header Content-Type text/plain;
                add_header Content-Length 0;
                return 204;
            }
            add_header Access-Control-Allow-Origin $allowed_origin always;
            add_header Access-Control-Allow-Credentials true always;
        }

        # ===================================================================
        # WebSocket proxy — real-time features
        # ===================================================================
        location /ws/ {
            # WebSocket connections still require auth
            auth_request /auth/validate;
            auth_request_set $user_id    $upstream_http_x_user_id;
            auth_request_set $tenant_id  $upstream_http_x_tenant_id;

            proxy_pass http://ws_service;

            # WebSocket-specific headers
            proxy_http_version 1.1;
            proxy_set_header Upgrade           $http_upgrade;
            proxy_set_header Connection        $connection_upgrade;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-User-Id         $user_id;
            proxy_set_header X-Tenant-Id       $tenant_id;
            proxy_set_header X-Correlation-Id  $correlation_id;

            # Extended timeouts for long-lived WebSocket connections
            proxy_connect_timeout 15s;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;

            # Disable buffering for real-time
            proxy_buffering off;
        }

        # ===================================================================
        # Auth-protected rate-limited endpoint — login
        # ===================================================================
        location /auth/api/v1/login {
            auth_request off;  # No auth needed to attempt login
            limit_req zone=auth_limit burst=5 nodelay;

            proxy_pass http://auth_service/api/v1/login;
            proxy_set_header X-Correlation-Id $correlation_id;
            proxy_set_header X-Real-IP        $remote_addr;
            proxy_set_header X-Forwarded-For  $proxy_add_x_forwarded_for;
            proxy_set_header Host             $host;

            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_connect_timeout 5s;
            proxy_read_timeout 10s;

            # CORS
            if ($request_method = 'OPTIONS') {
                add_header Access-Control-Allow-Origin $allowed_origin;
                add_header Access-Control-Allow-Methods "POST, OPTIONS";
                add_header Access-Control-Allow-Headers $cors_headers;
                add_header Access-Control-Max-Age $cors_max_age;
                add_header Content-Type text/plain;
                add_header Content-Length 0;
                return 204;
            }
            add_header Access-Control-Allow-Origin $allowed_origin always;
            add_header Access-Control-Allow-Credentials true always;
        }

        # ---- Token refresh (lower rate limit) ----
        location /auth/api/v1/refresh {
            auth_request off;
            limit_req zone=auth_limit burst=10 nodelay;

            proxy_pass http://auth_service/api/v1/refresh;
            proxy_set_header X-Correlation-Id $correlation_id;
            proxy_set_header Host             $host;

            proxy_http_version 1.1;
            proxy_set_header Connection "";

            if ($request_method = 'OPTIONS') {
                add_header Access-Control-Allow-Origin $allowed_origin;
                add_header Access-Control-Allow-Methods "POST, OPTIONS";
                add_header Access-Control-Allow-Headers $cors_headers;
                add_header Access-Control-Max-Age $cors_max_age;
                add_header Content-Type text/plain;
                add_header Content-Length 0;
                return 204;
            }
            add_header Access-Control-Allow-Origin $allowed_origin always;
            add_header Access-Control-Allow-Credentials true always;
        }

        # ===================================================================
        # Fallback — catch-all
        # ===================================================================
        location / {
            return 404 '{"success":false,"error":{"code":"GW_001","message":"Route not found"}}';
            add_header Content-Type application/json;
        }
    }

    # -----------------------------------------------------------------------
    # HTTP → HTTPS redirect
    # -----------------------------------------------------------------------
    server {
        listen 80;
        server_name api.example.com;
        return 301 https://$host$request_uri;
    }
}

# =============================================================================
# NOTES:
# =============================================================================
# 1. Replace 'api.example.com' and upstream names with actual values.
# 2. Use Docker DNS or service mesh (K8s service names) for upstream addresses.
# 3. For production, integrate:
#    - Certbot / ACME for automated SSL certificate renewal.
#    - Prometheus NGINX exporter for metrics on stub_status module.
#    - OpenTelemetry NGINX module for distributed tracing.
# 4. Rate limit zones are sized for ~10,000 IPs each; adjust for scale.
# 5. All auth-protected routes MUST include the `auth_request /auth/validate;` block.
# 6. WebSocket routes require the Upgrade/Connection header handling.
# 7. CORS origins must be explicitly listed in the `$allowed_origin` map.
# =============================================================================
